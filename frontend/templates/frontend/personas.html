{% extends 'frontend/base.html' %}

{% block title %}Personas{% endblock %}

{% block content %}
<a href="{% url 'blog' %}" class="btn btn-sm btn-outline-secondary mb-3">
  <i class="bi bi-arrow-left"></i> Volver al Blog
</a>
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">Personas</h1>
  <a href="{% url 'crear_persona' %}" class="btn btn-success">
    <i class="bi bi-person-plus"></i> Agregar Persona
  </a>
</div>

<div id="personas-alertas"></div>

<div class="table-responsive">
  <table class="table table-striped table-hover bg-white shadow-sm align-middle">
    <thead class="table-dark">
      <tr>
        <th>Foto</th>
        <th>RUT</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Viajes</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="cuerpo-personas">
      <tr>
        <td colspan="6" class="text-center text-muted py-4">Cargando…</td>
      </tr>
    </tbody>
  </table>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const SIN_FOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">' +
    '<rect width="100%" height="100%" fill="#ced4da"/>' +
    '<text x="50%" y="60%" font-family="sans-serif" font-size="20" fill="#495057" text-anchor="middle">?</text></svg>'
  );

  async function cargarPersonas() {
    const cuerpo = document.getElementById('cuerpo-personas');
    try {
      const respuesta = await apiFetch('/api/personas/');
      const personas = await obtenerDatos(respuesta);

      if (!personas.length) {
        cuerpo.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No hay personas registradas.</td></tr>';
        return;
      }

      cuerpo.innerHTML = '';
      personas.forEach(function (persona) {
        const fila = document.createElement('tr');

        const celdaFoto = document.createElement('td');
        const imagen = document.createElement('img');
        imagen.src = persona.foto || SIN_FOTO;
        imagen.alt = persona.nombre;
        imagen.className = 'foto-mini';
        imagen.onerror = function () { this.src = SIN_FOTO; };
        celdaFoto.appendChild(imagen);

        const celdaRut = document.createElement('td');
        celdaRut.textContent = persona.rut;

        const celdaNombre = document.createElement('td');
        celdaNombre.textContent = persona.nombre + ' ' + persona.apellido;

        const celdaCorreo = document.createElement('td');
        celdaCorreo.textContent = persona.email;

        const celdaViajes = document.createElement('td');
        celdaViajes.innerHTML = '<span class="badge bg-primary rounded-pill">' + persona.cantidad_viajes + '</span>';

        const celdaAcciones = document.createElement('td');
        celdaAcciones.innerHTML =
          '<a class="btn btn-sm btn-outline-secondary" title="Editar" href="/personas/' + persona.id + '/editar/"><i class="bi bi-pencil"></i></a>';

        fila.append(celdaFoto, celdaRut, celdaNombre, celdaCorreo, celdaViajes, celdaAcciones);
        cuerpo.appendChild(fila);
      });
    } catch (error) {
      cuerpo.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">No fue posible cargar las personas.</td></tr>';
      mostrarAlerta('personas-alertas', 'Error: ' + error.message, 'danger');
    }
  }

  document.addEventListener('DOMContentLoaded', cargarPersonas);
</script>
{% endblock %}

{% extends 'frontend/base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Iniciar Sesión</h1>
        <div id="login-alertas"></div>
        <form id="form-login">
          <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('form-login').addEventListener('submit', async function (evento) {
    evento.preventDefault();
    const usuario = document.getElementById('username').value.trim();
    const clave = document.getElementById('password').value;

    try {
      await iniciarSesion(usuario, clave);
      mostrarAlerta('login-alertas', 'Sesión iniciada correctamente. Redirigiendo…', 'success');
      window.location.href = '/';
    } catch (error) {
      const detalle = error.data && Object.keys(error.data).length
        ? erroresValidacion(error.data).join('<br>')
        : error.message;
      mostrarAlerta('login-alertas', detalle, 'danger');
    }
  });
</script>
{% endblock %}

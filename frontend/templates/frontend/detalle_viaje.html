{% extends 'frontend/base.html' %}

{% block title %}Detalle del viaje{% endblock %}

{% block content %}
<div id="detalle-alertas"></div>

<div id="detalle-cargando" class="text-center py-5 text-muted">
  <div class="spinner-border text-primary" role="status"></div>
  <p class="mt-2">Cargando viaje…</p>
</div>

<div id="detalle" class="d-none">
  <div class="row g-4">
    <div class="col-md-6">
      <img id="detalle-foto" class="img-fluid rounded shadow-sm w-100" src="" alt="Foto del viaje">
    </div>
    <div class="col-md-6">
      <h1 class="h3" id="detalle-titulo"></h1>
      <p class="text-muted mb-1" id="detalle-lugar"></p>
      <p class="mb-1" id="detalle-autor"></p>
      <p class="small text-secondary mb-1" id="detalle-fecha"></p>
      <p class="estrellas mb-3" id="detalle-estrellas"></p>
      <p id="detalle-relato"></p>
      <div class="d-flex gap-2 mt-3 flex-wrap">
        <a href="{% url 'blog' %}" class="btn btn-outline-secondary">Volver al Blog</a>
        <a href="{% url 'editar_viaje' pk %}" class="btn btn-outline-primary"><i class="bi bi-pencil"></i> Editar</a>
        <a href="{% url 'eliminar_viaje' pk %}" class="btn btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">' +
    '<rect width="100%" height="100%" fill="#dee2e6"/>' +
    '<text x="50%" y="50%" font-family="sans-serif" font-size="28" fill="#6c757d" text-anchor="middle">Sin foto</text></svg>'
  );

  function pintarEstrellas(calificacion) {
    const total = Number(calificacion) || 0;
    let salida = '';
    for (let i = 1; i <= 5; i++) {
      salida += i <= total ? '★' : '☆';
    }
    return salida;
  }

  async function cargarDetalle() {
    const pk = '{{ pk|escapejs }}';
    try {
      const respuesta = await apiFetch('/api/viajes/' + pk + '/');

      if (respuesta.status === 404) {
        throw new Error('El viaje solicitado no existe (404).');
      }

      const viaje = await obtenerDatos(respuesta);

      document.getElementById('detalle-cargando').classList.add('d-none');
      document.getElementById('detalle').classList.remove('d-none');

      const foto = document.getElementById('detalle-foto');
      foto.src = viaje.foto || PLACEHOLDER;
      foto.onerror = function () { this.src = PLACEHOLDER; };

      document.getElementById('detalle-titulo').textContent = viaje.titulo;
      document.getElementById('detalle-lugar').innerHTML = viaje.lugar_detalle
        ? '<i class="bi bi-geo-alt"></i> ' + viaje.lugar_detalle.nombre + ' &middot; ' +
          viaje.lugar_detalle.ciudad + ', ' + viaje.lugar_detalle.pais +
          '<br><span class="small">' + viaje.lugar_detalle.descripcion + '</span>'
        : 'Lugar no definido';
      document.getElementById('detalle-autor').innerHTML = viaje.persona_detalle
        ? '<i class="bi bi-person"></i> ' + viaje.persona_detalle.nombre + ' ' + viaje.persona_detalle.apellido +
          ' (' + viaje.persona_detalle.email + ')'
        : 'Autor desconocido';
      document.getElementById('detalle-fecha').innerHTML =
        '<i class="bi bi-calendar3"></i> Fecha de visita: ' + viaje.fecha_visita +
        ' &middot; Publicado el ' + new Date(viaje.creado).toLocaleDateString('es-CL');
      document.getElementById('detalle-estrellas').textContent = pintarEstrellas(viaje.calificacion);
      document.getElementById('detalle-relato').textContent = viaje.relato || 'Sin relato.';
    } catch (error) {
      document.getElementById('detalle-cargando').classList.add('d-none');
      const texto = error.status === 404 || /404/.test(error.message)
        ? 'El viaje solicitado no existe o fue eliminado (404).'
        : 'No fue posible cargar el viaje: ' + error.message;
      mostrarAlerta('detalle-alertas', texto, 'warning');
      document.getElementById('alertas') &&
        document.querySelector('main').insertAdjacentHTML('afterbegin',
          '<a class="btn btn-outline-secondary mb-3" href="{% url 'blog' %}">Volver al blog</a>');
    }
  }

  document.addEventListener('DOMContentLoaded', cargarDetalle);
</script>
{% endblock %}
